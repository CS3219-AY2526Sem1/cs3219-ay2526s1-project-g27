events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
      '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
      '}';

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    map $http_authorization $effective_auth {
        default $http_authorization;
        "" "";
    }
    large_client_header_buffers 4 32k;
    client_header_buffer_size 32k;
    
    server {
        listen 80;

        access_log /var/log/nginx/access.log json_combined;
        error_log /var/log/nginx/error.log;

        root /usr/share/nginx/html;
        index index.html;

        
        # --- Internal JWT Verification Endpoint ---
        # This endpoint validates JWT tokens using your auth service's JWKS
        location = /auth_verify {
            internal;
            proxy_pass http://auth-service:8000/api/jwt/verify-jwt;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;

            proxy_set_header Authorization $auth_token;
            
            access_log /var/log/nginx/auth_access.log json_combined;
        }
        # --- API Proxy Locations ---

        # Auth Service - NO JWT verification needed
        location /api/auth/ {
            proxy_pass http://auth-service:8000;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Allow-Credentials;
        }

        # Question Service - REQUIRES JWT verification
        location /api/questions/ {
            set $auth_token $http_authorization;

            # Verify JWT before proxying
            auth_request /auth_verify;
            
            # Strip /api/questions prefix before proxying
            rewrite ^/api/questions/(.*)$ /$1 break;
            proxy_pass http://question-service:3013;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Allow-Credentials;
        }

        location /api/matching/ {
            set $auth_token $http_authorization;
            if ($arg_token) {
                set $auth_token "Bearer $arg_token";
            }
                        
            auth_request /auth_verify;

            # SSE settings
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;

            # ✅ Add "Bearer " prefix here when forwarding to auth_verify
            proxy_set_header X-Forwarded-Token $auth_token;
            
            # ✅ Forward with Bearer prefix to matching service
            proxy_set_header Authorization "Bearer $arg_token";

            rewrite ^/api/matching/(.*)$ /$1 break;
            proxy_pass http://matching-service:3001;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        location /api/collab/ {
            set $auth_token "";
            if ($arg_token) {
                set $auth_token "Bearer $arg_token";
            }
            auth_request /auth_verify;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;

            rewrite ^/api/collab/(.*)$ /$1 break;
            proxy_pass http://collab-service:8081;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }



        # --- Frontend SPA (catch-all, defined LAST) ---
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            
            location ~* \.html$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }
    }
}