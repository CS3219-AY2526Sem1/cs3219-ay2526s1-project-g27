events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
      '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
      '}';

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    server {
        listen 80;

        access_log /var/log/nginx/access.log json_combined;
        error_log /var/log/nginx/error.log;

        root /usr/share/nginx/html;
        index index.html;

        # --- API Proxy Locations (Backend handles CORS) ---

        # Auth Service - proxy to backend
        location /api/auth/ {
            proxy_pass http://auth-service:8000;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass through all headers from backend (including CORS)
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Allow-Credentials;
        }

        # Question Service - proxy to backend
        location /api/questions/ {
            # Strip /api/questions prefix before proxying
            rewrite ^/api/questions/(.*)$ /$1 break;
            proxy_pass http://question-service:3013;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass through all headers from backend (including CORS)
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Allow-Credentials;
        }

        # Matching Service (uncomment when ready)
        # location /api/matching/ {
        #     rewrite ^/api/matching/(.*)$ /$1 break;
        #     proxy_pass http://matching-service:3001;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_pass_header Access-Control-Allow-Origin;
        #     proxy_pass_header Access-Control-Allow-Methods;
        #     proxy_pass_header Access-Control-Allow-Headers;
        #     proxy_pass_header Access-Control-Allow-Credentials;
        # }

        # --- Frontend SPA (catch-all, defined LAST) ---
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            
            # Disable caching for HTML files (good for SPA development)
            location ~* \.html$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }
    }
}