apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: leetcode-collab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matching-service
  template:
    metadata:
      labels:
        app: matching-service
    spec:
      containers:
      - name: matching-service
        # image: PLACEHOLDER/matching-service:latest  # ← We'll replace this
        image: matching-service:latest  # ← We'll replace this
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        envFrom:
        - secretRef:
            name: app-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: leetcode-collab
spec:
  selector:
    app: matching-service
  ports:
  - port: 3001
    targetPort: 3001
  sessionAffinity: ClientIP  # ← Sticky sessions
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
  type: ClusterIP