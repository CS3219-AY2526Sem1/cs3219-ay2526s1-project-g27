apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: leetcode-collab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      containers:
      - name: nginx
        image: nginx-gateway:latest   # ← use this exact image name
        imagePullPolicy: IfNotPresent  # ← Add this line
        # image: PLACEHOLDER/nginx-gateway:latest  # ← We'll replace this
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  namespace: leetcode-collab
spec:
  selector:
    app: nginx-gateway
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer