services:
  # Nginx Gateway - Serves frontend and proxies API requests
  nginx-gateway:
    build:
      context: .
      dockerfile: ./nginx-gateway/Dockerfile
    container_name: nginx-gateway-dev
    ports:
      - "80:80" 
    volumes:
      - ./logs/nginx:/var/log/nginx
      # Mount nginx config for easier development changes
      - ./nginx-gateway/config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - leetcode_collab_net
    depends_on:
      - auth-service
      - question-service
    restart: unless-stopped

  # Backend Authentication Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile.dev
    container_name: auth-service-dev
    ports:
      - "8000:8000"
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    env_file:
      - .env 
    networks:
      - leetcode_collab_net
    depends_on:
      - mongo
    restart: unless-stopped

  # Frontend React App (for hot-reload development)
  react-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: react-app-dev
    ports:
      - "5173:5173"  # Exposed for direct access during development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=/api
    env_file:
      - .env
    networks:
      - leetcode_collab_net
    depends_on:
      - nginx-gateway
    restart: unless-stopped

  # Question Service
  question-service:
    build:
      context: ./question-service
      dockerfile: dockerfile
    container_name: question-service-dev
    ports:
      - "3013:3013"
    volumes:
      - ./question-service:/app
      - /app/node_modules
    networks:
      - leetcode_collab_net
    depends_on:
      - mongo
    restart: unless-stopped
  
  # Matching Service (uncomment when ready)
  matching-service:
    build:
      context: ./matching-service
      dockerfile: Dockerfile
    container_name: matching-service-dev
    volumes:
      - ./matching-service:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    env_file:
      - .env
    networks:
      - leetcode_collab_net
    depends_on:
      - redis
    restart: unless-stopped

  # Collab Service
  collab-service:
    build:
      context: ./collab/server
    container_name: collab-service-dev
    ports:
      - "8081:8081"  # Expose Yjs WebSocket server
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - leetcode_collab_net
    depends_on:
      - mongo
    

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    networks: 
      - leetcode_collab_net
    command: redis-server --appendonly no --save ""
    restart: unless-stopped

  # MongoDB
  mongo:
    image: mongo:7
    container_name: mongo-auth-dev
    ports:
      - "27017:27017"
    networks: 
      - leetcode_collab_net
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
  redis_data:

networks:
  leetcode_collab_net:
    driver: bridge